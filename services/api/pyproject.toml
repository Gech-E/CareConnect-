[project]
name = "careconnect-api"
version = "1.0.0"
description = "CareConnect Telehealth Platform - Production API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.121.0,<1",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.12.0,<3",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "PyJWT[crypto]>=2.10.0,<3",
    "argon2-cffi>=25.1.0,<26",
    "bcrypt>=5.0.0,<6",
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "boto3>=1.35.0",
    "structlog>=24.4.0",
    "icalendar>=6.0.0",
    "tzdata>=2025.2",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.14.0,<1",
    "pip-audit>=2.9.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires PostgreSQL and Redis"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
