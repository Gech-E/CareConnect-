<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

xs":"8px","sm":"16px","margin-mobile":"16px","margin-desktop":"48px","xl":"64px","gutter":"24px","base":"4px"},"fontFamily":{"headline-lg":["Inter"],"headline-md":["Inter"],"body-lg":["Inter"],"label-md":["Inter"],"headline-xl":["Inter"],"label-lg":["Inter"],"body-md":["Inter"],"headline-lg-mobile":["Inter"]},"fontSize":{"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.01em","fontWeight":"600"}],"headline-md":["24px",{"lineHeight":"32px","fontWeight":"600"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}],"label-md":["12px",{"lineHeight":"16px","fontWeight":"500"}],"headline-xl":["48px",{"lineHeight":"56px","letterSpacing":"-0.02em","fontWeight":"700"}],"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"600"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"headline-lg-mobile":["28px",{"lineHeight":"36px","fontWeight":"600"}]}}}}</script></head><body class="bg-background font-body-md text-on-background min-h-screen flex flex-col"><header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-margin-mobile flex items-center gap-sm"><button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-on-surface">arrow_back</span></button><h1 class="font-headline-md text-headline-md text-on-surface truncate">Active Call</h1></div></header><main class="flex-1 pt-16 bg-surface"><div class="flex flex-col w-full relative h-[calc(100vh-64px)] overflow-hidden bg-on-background">
<!-- Video Feed Background (Doctor) -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center" data-alt="A high-quality, well-lit video feed of a professional, empathetic female doctor in her mid-40s wearing a white coat over a soft blue blouse. She is looking directly at the camera with a reassuring smile. The background is a clean, modern clinical office with subtle soft lighting, blurred slightly for depth of field. The color grading is natural and trustworthy, leaning into cool, calming tones." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuARIuNTsb0e98x1yQI2vWS62qXGE0VyhmqDrgBPorPt3n9uYKGqY3MqcmUq8tLFDSg-cevOEDRR_9vIqbafQ2M-oqMjJpKgE9hXb0933x-fgBAuSR6GRjQGb2qLoGC8fY1jZxunNYo_Cl8FUSwdypYYM6QFT86CyqasHI0SKX-yVmj03Tuz70K4lEXph4UeK2SbJKygYyg81sfAXScgVLFWKfRj72Dm6S3bpJZIJMf0sxT3sUQxhQ')"></div>
<!-- Subtle Gradient Scrim for Controls -->
<div class="absolute inset-x-0 bottom-0 h-48 bg-gradient-to-t from-on-background/80 via-on-background/40 to-transparent pointer-events-none"></div>
<!-- Content Layer -->
<div class="relative z-10 flex flex-col h-full justify-between p-margin-mobile">
<!-- Top Area: Warning & PIP -->
<div class="flex flex-col items-end gap-sm w-full">
<!-- Weak Connection Warning -->
<div class="w-full flex items-center justify-between bg-error-container/90 backdrop-blur-md rounded-lg p-xs pl-sm shadow-md transition-opacity duration-500" id="connection-warning">
<div class="flex items-center gap-xs text-on-error-container">
<span class="material-symbols-outlined text-body-md">wifi_tethering_error</span>
<span class="font-label-lg text-label-lg">Weak connection</span>
</div>
<button aria-label="Dismiss warning" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-on-error-container/10 transition-colors text-on-error-container" id="dismiss-warning">
<span class="material-symbols-outlined text-body-md">close</span>
</button>
</div>
<!-- Picture-in-Picture (User) -->
<div class="w-24 h-32 md:w-32 md:h-48 rounded-xl overflow-hidden shadow-xl bg-surface-container shadow-black/20 self-end mt-sm">
<div class="w-full h-full bg-cover bg-center" data-alt="A small picture-in-picture video feed showing a young adult male with short hair, casually dressed, looking slightly off-camera. The lighting is natural daylight from a window, creating soft shadows. The background is a tidy home living room wall." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDrG_zRkVWZkqJbmKNTDhh52taS1YJQdM2f8KNdCdC6h7AbzX3kG293Qrm1AD9CTUnK2LGKRfhInzcUymSoSHMqqShbqZiJkK2UK2Wc0EhcEnH2HbIbmzaZMTBDlSJbDuaH6VuOTKSrEtV0rL391q9Tt3Rg5MulLn3hpM-23PdnBPocq1EJhu8XJroKIaRZyfEmIFqSMpm09UvNlgrFsFsFmBdveXL5LmhZan1N5SC9TcjFLXJTXQ')"></div>
</div>
</div>
<!-- Bottom Area: Doctor Info & Controls -->
<div class="w-full flex flex-col gap-sm pb-safe">
<!-- Doctor Info Overlay -->
<div class="text-on-primary mb-xs drop-shadow-md">
<h2 class="font-headline-md text-headline-md tracking-tight">Dr. Sarah Jenkins</h2>
<p class="font-body-md text-body-md opacity-90 flex items-center gap-base">
<span class="w-2 h-2 rounded-full bg-error animate-pulse"></span>
          04:23
        </p>
</div>
<!-- Control Bar -->
<div class="flex items-center justify-center gap-sm bg-surface/10 backdrop-blur-xl p-xs rounded-full shadow-lg border border-white/10">
<!-- Mute -->
<button aria-label="Toggle Microphone" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high/80 text-on-surface hover:bg-surface-variant transition-colors shadow-sm" id="btn-mute">
<span class="material-symbols-outlined font-light" style="font-variation-settings: 'FILL' 0;">mic</span>
</button>
<!-- Camera -->
<button aria-label="Toggle Camera" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high/80 text-on-surface hover:bg-surface-variant transition-colors shadow-sm" id="btn-camera">
<span class="material-symbols-outlined font-light" style="font-variation-settings: 'FILL' 0;">videocam</span>
</button>
<!-- Chat -->
<button aria-label="Open Chat" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high/80 text-on-surface hover:bg-surface-variant transition-colors shadow-sm relative">
<span class="material-symbols-outlined font-light" style="font-variation-settings: 'FILL' 0;">chat</span>
<span class="absolute top-0 right-0 w-3 h-3 bg-primary rounded-full border-2 border-surface"></span>
</button>
<!-- End Call -->
<button aria-label="End Call" class="w-16 h-12 flex items-center justify-center rounded-full bg-error text-on-error hover:opacity-90 transition-opacity shadow-md ml-xs">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">call_end</span>
</button>
</div>
</div>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Dismiss Warning Logic
    const warningBanner = document.getElementById('connection-warning');
    const dismissBtn = document.getElementById('dismiss-warning');
    
    if(dismissBtn && warningBanner) {
      dismissBtn.addEventListener('click', () => {
        warningBanner.style.opacity = '0';
        setTimeout(() => {
          warningBanner.style.display = 'none';
        }, 500);
      });
    }

    // Toggle Button Logic (Mic/Camera)
    const toggleButtons = [
      { id: 'btn-mute', iconOn: 'mic', iconOff: 'mic_off' },
      { id: 'btn-camera', iconOn: 'videocam', iconOff: 'videocam_off' }
    ];

    toggleButtons.forEach(btnConfig => {
      const btn = document.getElementById(btnConfig.id);
      if(btn) {
        let isOn = true;
        btn.addEventListener('click', () => {
          isOn = !isOn;
          const icon = btn.querySelector('.material-symbols-outlined');
          
          if(isOn) {
            icon.textContent = btnConfig.iconOn;
            btn.classList.replace('bg-surface-dim', 'bg-surface-container-high/80');
            btn.classList.replace('text-on-surface-variant', 'text-on-surface');
            icon.style.fontVariationSettings = "'FILL' 0";
          } else {
            icon.textContent = btnConfig.iconOff;
            btn.classList.replace('bg-surface-container-high/80', 'bg-surface-dim');
            btn.classList.replace('text-on-surface', 'text-on-surface-variant');
             icon.style.fontVariationSettings = "'FILL' 1";
          }
          
          // Subtle pop animation
          btn.style.transform = 'scale(0.95)';
          setTimeout(() => {
            btn.style.transform = 'scale(1)';
          }, 150);
        });
      }
    });
  });
</script></main></body></html>
