name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatchling
        pip install -e ./services/api[dev]
        pip install -e ./services/worker
    - name: Run Black
      run: |
        black --check ./services
    - name: Run Ruff
      run: |
        ruff check ./services
    - name: Run Tests
      run: |
        pytest ./services/api/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - uses: pnpm/action-setup@v2
      with:
        version: 8
    - name: Install dependencies
      run: pnpm install
    - name: Lint
      run: pnpm run lint
    - name: Typecheck
      run: pnpm --filter "apps/*" exec tsc --noEmit
    - name: Build
      run: pnpm run build
